<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperForge Console</title>
    <style>
      :root {
        --bg: #f4efe6;
        --ink: #1d1a16;
        --muted: #675d52;
        --panel: rgba(255, 250, 244, 0.86);
        --panel-strong: #fff9f2;
        --line: rgba(48, 37, 24, 0.12);
        --accent: #a4492a;
        --accent-2: #1f5560;
        --ok: #2d6a4f;
        --warn: #b7791f;
        --skel: #7d5a50;
        --shadow: 0 18px 44px rgba(54, 37, 20, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(164, 73, 42, 0.14), transparent 32%),
          radial-gradient(circle at top right, rgba(31, 85, 96, 0.12), transparent 34%),
          linear-gradient(180deg, #fbf5ed 0%, var(--bg) 100%);
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }
      a {
        color: inherit;
      }
      .shell {
        width: min(1200px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }
      .hero-main {
        padding: 28px;
      }
      .hero-side {
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(164, 73, 42, 0.1), rgba(31, 85, 96, 0.09)),
          var(--panel-strong);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(164, 73, 42, 0.08);
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1,
      h2,
      h3 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        margin: 0;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: clamp(34px, 4vw, 54px);
        line-height: 0.95;
        margin-top: 18px;
      }
      .hero-copy {
        max-width: 760px;
        margin-top: 16px;
        line-height: 1.65;
        color: var(--muted);
        font-size: 15px;
      }
      .status-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        background: #fffdf9;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 20px;
      }
      .span-12 { grid-column: span 12; }
      .span-8 { grid-column: span 8; }
      .span-7 { grid-column: span 7; }
      .span-6 { grid-column: span 6; }
      .span-5 { grid-column: span 5; }
      .span-4 { grid-column: span 4; }
      .span-3 { grid-column: span 3; }
      .panel {
        padding: 22px;
      }
      .panel h2 {
        font-size: 24px;
        margin-bottom: 14px;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .metric {
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--line);
      }
      .metric .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .metric .value {
        margin-top: 12px;
        font-size: 30px;
        font-weight: 700;
      }
      .timeline {
        display: grid;
        gap: 12px;
      }
      .step {
        display: grid;
        grid-template-columns: 160px 1fr auto;
        gap: 14px;
        align-items: start;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid var(--line);
      }
      .step code,
      table code,
      pre {
        font-family: "SF Mono", "Monaco", "Cascadia Code", monospace;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 76px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge-live {
        background: rgba(45, 106, 79, 0.12);
        color: var(--ok);
      }
      .badge-bridge {
        background: rgba(31, 85, 96, 0.12);
        color: var(--accent-2);
      }
      .badge-skeleton {
        background: rgba(125, 90, 80, 0.11);
        color: var(--skel);
      }
      .badge-doc {
        background: rgba(183, 121, 31, 0.12);
        color: var(--warn);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px 8px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      li + li {
        margin-top: 8px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      button {
        border: 1px solid rgba(164, 73, 42, 0.18);
        background: linear-gradient(180deg, rgba(164, 73, 42, 0.1), rgba(164, 73, 42, 0.05));
        color: var(--ink);
        border-radius: 14px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: rgba(164, 73, 42, 0.36);
      }
      .mini-list {
        display: grid;
        gap: 10px;
      }
      .mini-item {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.62);
      }
      .mono-preview {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 16px;
        border-radius: 18px;
        background: #261d15;
        color: #f9f1e7;
        font-size: 12px;
        line-height: 1.6;
        overflow: auto;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      @media (max-width: 1080px) {
        .hero,
        .metrics {
          grid-template-columns: 1fr;
        }
        .span-8,
        .span-7,
        .span-6,
        .span-5,
        .span-4,
        .span-3 {
          grid-column: span 12;
        }
        .step {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
